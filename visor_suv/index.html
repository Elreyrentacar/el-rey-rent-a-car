<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f2f5fa;color:#17283e}#toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:#fff}button,select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:13px}button.on{background:#183451;color:white}#stage{height:370px;touch-action:none;position:relative;overflow:hidden}canvas{display:block}#hint{position:absolute;bottom:8px;left:8px;background:#ffffffdd;padding:6px;border-radius:7px;font-size:12px;pointer-events:none}#list{padding:8px;font-size:12px;max-height:80px;overflow:auto}#error{padding:10px;color:#a12c37;display:none}</style></head><body>
<div id="toolbar"><button id="rotate" class="on">🔄 Girar</button><button id="mark">📍 Marcar daño</button><select id="kind"><option>Rayón</option><option>Golpe</option><option>Abolladura</option><option>Otro</option></select><button id="undo">↶ Deshacer</button><button id="clear">🧹 Limpiar</button></div><div id="stage"><div id="hint">Girar: arrastra · Marcar: toca la carrocería · Zoom: dos dedos</div></div><div id="list">Sin daños marcados</div><div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(function(){
const send=(type,data)=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:510});
let marks=[],mode='rotate',lastInput='',initialized=false;
function emit(){send('streamlit:setComponentValue',{value:marks});document.getElementById('list').textContent=marks.length?marks.map((m,i)=>`${i+1}. ${m.tipo} · ${m.zona}`).join('   |   '):'Sin daños marcados';}
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){const a=e.data.args||{};if(!initialized){marks=Array.isArray(a.marcas)?a.marcas:[];initialized=true;emit();} }});
if(!window.THREE){document.getElementById('error').style.display='block';document.getElementById('error').textContent='No se cargó el motor 3D. Revisa la conexión a internet.';return;}
try{
const T=THREE,stage=document.getElementById('stage'),scene=new T.Scene();scene.background=new T.Color(0xf2f5fa);
const camera=new T.PerspectiveCamera(44,1,.1,100);const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x69798d,2.5));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(5,9,7);sun.castShadow=true;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0xe9eef5}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
 const car=new T.Group();scene.add(car);const surfaces=[];
 const paint=new T.MeshPhysicalMaterial({color:0xf5f7f8,metalness:.22,roughness:.31,clearcoat:1,clearcoatRoughness:.15,side:T.DoubleSide});
 const glass=new T.MeshPhysicalMaterial({color:0x182e42,metalness:.25,roughness:.12,transparent:true,opacity:.96,side:T.DoubleSide});
 const black=new T.MeshStandardMaterial({color:0x17202a,roughness:.65});
 const trim=new T.MeshStandardMaterial({color:0x303c48,metalness:.28,roughness:.48});
 const chrome=new T.MeshStandardMaterial({color:0xaebbc5,metalness:.8,roughness:.22});
 const lamp=new T.MeshStandardMaterial({color:0xf3f9ff,emissive:0x8eaac1,emissiveIntensity:.28});
 const tail=new T.MeshStandardMaterial({color:0xc52b35,emissive:0x67040d,emissiveIntensity:.25});
 function box(w,h,d,mat,x,y,z,zone,markable=true){let o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;car.add(o);if(markable){o.userData.zone=zone||'Carrocería';surfaces.push(o);}return o;}
 function mesh(verts,faces,mat,zone,markable=true){const positions=[],indices=[];for(const v of verts)positions.push(...v);for(const f of faces){for(let i=1;i<f.length-1;i++)indices.push(f[0],f[i],f[i+1]);}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(positions,3));geo.setIndex(indices);geo.computeVertexNormals();const obj=new T.Mesh(geo,mat);obj.castShadow=true;obj.receiveShadow=true;obj.userData.zone=zone;car.add(obj);if(markable)surfaces.push(obj);return obj;}
 // SUV blanco de estilo crossover moderno: frente hacia z negativo.
 // Carrocería de secciones transversales, más fluida que los cubos anteriores.
 const sections=[[-2.36,.80,.91,1.05],[-2.17,.70,1.07,1.25],[-1.60,.69,1.11,1.43],[-.80,.69,1.11,1.42],[.75,.69,1.11,1.42],[1.72,.69,1.08,1.38],[2.25,.76,.99,1.17],[2.38,.83,.87,1.02]];
 const vv=[];for(const [z,bottom,half,top] of sections){vv.push([-half,bottom,z],[half,bottom,z],[half,top,z],[-half,top,z]);}
 const ff=[];for(let i=0;i<sections.length-1;i++)for(let k=0;k<4;k++){const n=i*4+k,m=i*4+(k+1)%4;ff.push([n,m,m+4,n+4]);}ff.push([0,3,2,1]);ff.push([28,29,30,31]);mesh(vv,ff,paint,'Carrocería');
 // Capó y líneas laterales; la parte superior es chapa marcable.
 mesh([[-1.02,1.43,-1.70],[1.02,1.43,-1.70],[.94,1.34,-2.26],[-.94,1.34,-2.26]],[[0,1,2,3]],paint,'Capó');
 // Cabina trapezoidal con techo ligeramente descendente.
 const cabinVerts=[[-.94,1.41,-1.03],[.94,1.41,-1.03],[-.87,2.03,-.49],[.87,2.03,-.49],[-.86,2.04,1.16],[.86,2.04,1.16],[-.97,1.42,1.80],[.97,1.42,1.80]];
 mesh(cabinVerts,[[0,1,3,2],[2,3,5,4],[4,5,7,6],[0,2,4,6],[1,7,5,3],[0,6,7,1]],glass,'Cristales',false);
 mesh([[-.89,2.05,-.51],[.89,2.05,-.51],[.87,2.05,1.18],[-.87,2.05,1.18]],[[0,1,2,3]],paint,'Techo');
 for(const side of [-1,1]){
  const label=side<0?'Lado izquierdo':'Lado derecho';
  // Molduras, columnas, puertas y marcos de ventanas.
  box(.07,.13,2.63,paint,side*1.105,1.36,.20,label);
  box(.065,.67,.075,trim,side*.91,1.72,-.45,'Pilar delantero',false);
  box(.07,.67,.075,trim,side*.91,1.72,.49,'Pilar central',false);
  box(.07,.58,.085,trim,side*.93,1.70,1.25,'Pilar trasero',false);
  box(.10,.065,.35,black,side*1.05,1.62,-.80,'Espejo',false);
  box(.10,.065,1.45,trim,side*.72,2.10,.31,'Riel de techo',false);
  for(const z of [-.39,.83])box(.045,.045,.27,chrome,side*1.14,1.18,z,'Manija',false);
  box(.11,.15,3.85,trim,side*1.10,.70,0,'Faldón',false);
  // Cuatro ruedas de perfil y rines con radios.
  for(const z of [-1.52,1.52]){
   const tire=new T.Mesh(new T.CylinderGeometry(.48,.48,.29,48),black);tire.rotation.z=Math.PI/2;tire.position.set(side*1.13,.49,z);tire.castShadow=true;car.add(tire);
   const rim=new T.Mesh(new T.CylinderGeometry(.31,.31,.305,40),chrome);rim.rotation.z=Math.PI/2;rim.position.set(side*1.13+side*.022,.49,z);car.add(rim);
   const hub=new T.Mesh(new T.CylinderGeometry(.12,.12,.32,32),trim);hub.rotation.z=Math.PI/2;hub.position.set(side*1.13+side*.045,.49,z);car.add(hub);
   for(let k=0;k<5;k++){const ang=k*Math.PI*2/5;const spoke=box(.035,.19,.055,trim,side*1.31,.49+Math.cos(ang)*.19,z+Math.sin(ang)*.19,'Rin',false);spoke.rotation.x=ang;}
  }
 }
 // Frontal: parrilla oscura, faros angulados y defensa inferior.
 box(1.65,.32,.095,trim,0,1.02,-2.40,'Parrilla',false);
 for(let y of [.91,1.00,1.09])box(1.50,.018,.11,black,0,y,-2.46,'Parrilla',false);
 box(1.78,.16,.15,black,0,.69,-2.43,'Defensa',false);
 for(const side of [-1,1]){
  box(.62,.115,.13,lamp,side*.76,1.29,-2.31,'Faro',false);
  box(.32,.065,.12,chrome,side*.76,.73,-2.47,'Antiniebla',false);
  box(.55,.14,.12,tail,side*.78,1.23,2.36,'Luz trasera',false);
 }
 box(1.55,.17,.14,trim,0,.72,2.40,'Defensa trasera',false);
// Marcas adheridas a la superficie en coordenadas locales.
const markerGroup=new T.Group();car.add(markerGroup);function drawMarks(){markerGroup.clear();for(const m of marks){let ball=new T.Mesh(new T.SphereGeometry(.075,12,10),new T.MeshBasicMaterial({color:0xed283f,depthTest:false}));ball.position.set(m.x,m.y,m.z);ball.renderOrder=20;markerGroup.add(ball);}}
let yaw=.55,pitch=.20,dist=10.5;function update(){camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),1.20+dist*Math.sin(pitch),-dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,1.20,0);}function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.domElement.style.width=w+"px";renderer.domElement.style.height=h+"px";}resize();update();new ResizeObserver(resize).observe(stage);
let pointers=new Map(),start=null,moved=false,pinch=0;const raycaster=new T.Raycaster(),mouse=new T.Vector2();
function point(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects(surfaces,false)[0];}
function addMark(e){let hit=point(e);if(!hit)return;let pos=car.worldToLocal(hit.point.clone());let normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);pos.addScaledVector(normal,.085);marks.push({x:+pos.x.toFixed(3),y:+pos.y.toFixed(3),z:+pos.z.toFixed(3),tipo:document.getElementById('kind').value,zona:hit.object.userData.zone||'Carrocería'});drawMarks();emit();}
stage.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){start=[e.clientX,e.clientY];moved=false;}stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()];let d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)dist=Math.max(6.5,Math.min(19,dist*pinch/d));pinch=d;update();return;}pinch=0;if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>7)moved=true;if(mode==='rotate'){yaw+=(e.clientX-old[0])*.008;pitch=Math.max(-.05,Math.min(1.3,pitch+(e.clientY-old[1])*.006));update();}});
stage.addEventListener('pointerup',e=>{if(mode==='mark'&&!moved&&pointers.size===1)addMark(e);pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6.5,Math.min(19,dist+e.deltaY*.009));update();},{passive:false});
function setMode(m){mode=m;document.getElementById('rotate').classList.toggle('on',m==='rotate');document.getElementById('mark').classList.toggle('on',m==='mark');}document.getElementById('rotate').onclick=()=>setMode('rotate');document.getElementById('mark').onclick=()=>setMode('mark');document.getElementById('undo').onclick=()=>{marks.pop();drawMarks();emit();};document.getElementById('clear').onclick=()=>{if(marks.length&&confirm('¿Eliminar todas las marcas 3D?')){marks=[];drawMarks();emit();}};
drawMarks();emit();function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='No se pudo iniciar el visor 3D: '+err.message;}
})();</script></body></html>
