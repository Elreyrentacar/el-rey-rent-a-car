<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f2f5fa;color:#17283e}#toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:#fff}button,select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:13px}button.on{background:#183451;color:white}#stage{height:390px;touch-action:none;position:relative}canvas{display:block}#hint{position:absolute;bottom:8px;left:8px;background:#ffffffdd;padding:6px;border-radius:7px;font-size:12px;pointer-events:none}#list{padding:8px;font-size:12px;max-height:80px;overflow:auto}#error{padding:10px;color:#a12c37;display:none}</style></head><body>
<div id="toolbar"><button id="rotate" class="on">🔄 Girar</button><button id="mark">📍 Marcar daño</button><select id="kind"><option>Rayón</option><option>Golpe</option><option>Abolladura</option><option>Otro</option></select><button id="undo">↶ Deshacer</button><button id="clear">🧹 Limpiar</button></div><div id="stage"><div id="hint">Girar: arrastra · Marcar: toca la carrocería · Zoom: dos dedos</div></div><div id="list">Sin daños marcados</div><div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(function(){
const send=(type,data)=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:535});
let marks=[],mode='rotate',lastInput='',initialized=false;
function emit(){send('streamlit:setComponentValue',{value:marks});document.getElementById('list').textContent=marks.length?marks.map((m,i)=>`${i+1}. ${m.tipo} · ${m.zona}`).join('   |   '):'Sin daños marcados';}
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){const a=e.data.args||{};if(!initialized){marks=Array.isArray(a.marcas)?a.marcas:[];initialized=true;emit();} }});
if(!window.THREE){document.getElementById('error').style.display='block';document.getElementById('error').textContent='No se cargó el motor 3D. Revisa la conexión a internet.';return;}
try{
const T=THREE,stage=document.getElementById('stage'),scene=new T.Scene();scene.background=new T.Color(0xf2f5fa);
const camera=new T.PerspectiveCamera(38,1,.1,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x69798d,2.5));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(5,9,7);sun.castShadow=true;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xe9eef5}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const car=new T.Group();scene.add(car);const surfaces=[];const paint=new T.MeshPhysicalMaterial({color:0xaab8c7,metalness:.62,roughness:.22,clearcoat:1,clearcoatRoughness:.12});const glass=new T.MeshPhysicalMaterial({color:0x253d55,metalness:.3,roughness:.13,transparent:true,opacity:.91});const black=new T.MeshStandardMaterial({color:0x17212b,roughness:.5});const chrome=new T.MeshStandardMaterial({color:0xbec9d5,metalness:.85,roughness:.2});const lamp=new T.MeshStandardMaterial({color:0xf9f7e9,emissive:0xbbb8a0,emissiveIntensity:.2});const tail=new T.MeshStandardMaterial({color:0xbd2037,emissive:0x6d0614,emissiveIntensity:.25});
function box(w,h,d,mat,x,y,z,zone,markable=true){let o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;car.add(o);if(markable){o.userData.zone=zone||'Carrocería';surfaces.push(o);}return o;}
// SUV genérico: silueta alta, capó, techo, parrilla, guardabarros, cristales y molduras.
box(2.25,.65,4.55,paint,0,.91,0,'Carrocería');box(2.16,.18,1.35,paint,0,1.30,-1.55,'Capó');box(2.12,.15,.95,paint,0,1.27,1.78,'Portón trasero');
box(1.93,.68,2.45,glass,0,1.71,.18,'Cristales',false);box(2.02,.12,2.4,paint,0,2.11,.2,'Techo');
for(let side of [-1,1]){box(.13,.49,2.12,paint,side*1.035,1.69,.18,side<0?'Lado izquierdo':'Lado derecho');box(.05,.15,2.1,chrome,side*1.1,1.39,.2,'Moldura',false);box(.13,.13,.37,black,side*1.15,1.64,-.75,'Espejo',false);box(.08,.08,1.55,black,side*.78,2.23,.20,'Riel',false);for(let z of [-1.46,1.48]){let wheel=new T.Mesh(new T.CylinderGeometry(.46,.46,.23,32),black);wheel.rotation.z=Math.PI/2;wheel.position.set(side*1.16,.47,z);car.add(wheel);let rim=new T.Mesh(new T.CylinderGeometry(.27,.27,.24,12),chrome);rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);rim.position.x+=side*.025;car.add(rim);}}
box(1.65,.38,.10,black,0,.88,-2.31,'Parrilla',false);box(1.55,.10,.12,chrome,0,.70,-2.35,'Parachoques delantero');box(1.65,.18,.12,black,0,.68,2.31,'Parachoques trasero');
for(let s of [-1,1]){box(.53,.15,.12,lamp,s*.78,1.13,-2.32,'Faro',false);box(.5,.20,.12,tail,s*.78,1.15,2.32,'Luz trasera',false);}
// Marcas adheridas a la superficie en coordenadas locales.
const markerGroup=new T.Group();car.add(markerGroup);function drawMarks(){markerGroup.clear();for(const m of marks){let ball=new T.Mesh(new T.SphereGeometry(.075,12,10),new T.MeshBasicMaterial({color:0xed283f,depthTest:false}));ball.position.set(m.x,m.y,m.z);ball.renderOrder=20;markerGroup.add(ball);}}
let yaw=.62,pitch=.31,dist=8.6;function update(){camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),1.1+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,1.1,0);}function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}resize();update();new ResizeObserver(resize).observe(stage);
let pointers=new Map(),start=null,moved=false,pinch=0;const raycaster=new T.Raycaster(),mouse=new T.Vector2();
function point(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects(surfaces,false)[0];}
function addMark(e){let hit=point(e);if(!hit)return;let pos=car.worldToLocal(hit.point.clone());let normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);pos.addScaledVector(normal,.085);marks.push({x:+pos.x.toFixed(3),y:+pos.y.toFixed(3),z:+pos.z.toFixed(3),tipo:document.getElementById('kind').value,zona:hit.object.userData.zone||'Carrocería'});drawMarks();emit();}
stage.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){start=[e.clientX,e.clientY];moved=false;}stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()];let d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)dist=Math.max(4.7,Math.min(15,dist*pinch/d));pinch=d;update();return;}pinch=0;if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>7)moved=true;if(mode==='rotate'){yaw-=(e.clientX-old[0])*.008;pitch=Math.max(-.05,Math.min(1.3,pitch+(e.clientY-old[1])*.006));update();}});
stage.addEventListener('pointerup',e=>{if(mode==='mark'&&!moved&&pointers.size===1)addMark(e);pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(4.7,Math.min(15,dist+e.deltaY*.009));update();},{passive:false});
function setMode(m){mode=m;document.getElementById('rotate').classList.toggle('on',m==='rotate');document.getElementById('mark').classList.toggle('on',m==='mark');}document.getElementById('rotate').onclick=()=>setMode('rotate');document.getElementById('mark').onclick=()=>setMode('mark');document.getElementById('undo').onclick=()=>{marks.pop();drawMarks();emit();};document.getElementById('clear').onclick=()=>{if(marks.length&&confirm('¿Eliminar todas las marcas 3D?')){marks=[];drawMarks();emit();}};
drawMarks();emit();function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='No se pudo iniciar el visor 3D: '+err.message;}
})();</script></body></html>
