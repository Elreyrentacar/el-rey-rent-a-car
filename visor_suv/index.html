<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f2f5fa;color:#17283e}#toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:#fff}button,select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:13px}button.on{background:#183451;color:white}#stage{height:350px;touch-action:none;position:relative}canvas{display:block}#hint{position:absolute;bottom:8px;left:8px;background:#ffffffdd;padding:6px;border-radius:7px;font-size:12px;pointer-events:none}#list{padding:8px;font-size:12px;max-height:80px;overflow:auto}#error{padding:10px;color:#a12c37;display:none}</style></head><body>
<div id="toolbar"><button id="rotate" class="on">🔄 Girar</button><button id="mark">📍 Marcar daño</button><select id="kind"><option>Rayón</option><option>Golpe</option><option>Abolladura</option><option>Otro</option></select><button id="undo">↶ Deshacer</button><button id="clear">🧹 Limpiar</button></div><div id="model" style="padding:5px 10px;font-size:12px;font-weight:600;color:#183451">🚙 Modelo de reserva</div><div id="stage"><div id="hint">Girar: arrastra · Marcar: toca la carrocería · Zoom: dos dedos</div></div><div id="list">Sin daños marcados</div><div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(function(){
const send=(type,data)=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:500});
let marks=[],mode='rotate',lastInput='',initialized=false;
function emit(){send('streamlit:setComponentValue',{value:marks});document.getElementById('list').textContent=marks.length?marks.map((m,i)=>`${i+1}. ${m.tipo} · ${m.zona}`).join('   |   '):'Sin daños marcados';}
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){const a=e.data.args||{};document.getElementById("model").textContent="🚙 "+(a.modelo||"SUV")+" · Vista 3D genérica provisional";if(!initialized){marks=Array.isArray(a.marcas)?a.marcas:[];initialized=true;emit();} }});
if(!window.THREE){document.getElementById('error').style.display='block';document.getElementById('error').textContent='No se cargó el motor 3D. Revisa la conexión a internet.';return;}
try{
const T=THREE,stage=document.getElementById('stage'),scene=new T.Scene();scene.background=new T.Color(0xf2f5fa);
const camera=new T.PerspectiveCamera(44,1,.1,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x69798d,2.5));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(5,9,7);sun.castShadow=true;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xe9eef5}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const car=new T.Group();scene.add(car);const surfaces=[];const paint=new T.MeshPhysicalMaterial({color:0xf2f5f8,metalness:.18,roughness:.26,clearcoat:1,clearcoatRoughness:.12});const glass=new T.MeshPhysicalMaterial({color:0x142a40,metalness:.3,roughness:.13,transparent:true,opacity:.91});const black=new T.MeshStandardMaterial({color:0x17212b,roughness:.5});const chrome=new T.MeshStandardMaterial({color:0xbec9d5,metalness:.85,roughness:.2});const lamp=new T.MeshStandardMaterial({color:0xf9f7e9,emissive:0xbbb8a0,emissiveIntensity:.2});const tail=new T.MeshStandardMaterial({color:0xbd2037,emissive:0x6d0614,emissiveIntensity:.25});
function box(w,h,d,mat,x,y,z,zone,markable=true){let o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;car.add(o);if(markable){o.userData.zone=zone||'Carrocería';surfaces.push(o);}return o;}
 // SUV moderno inspirado en las proporciones de un RAV4 / Tucson; modelo genérico sin emblemas.
 const bodyShape=new T.Shape();
 [[-2.28,.68],[-2.27,1.05],[-2.05,1.28],[-1.05,1.39],[.88,1.39],[1.92,1.25],[2.24,1.09],[2.28,.68]].forEach(([z,y],i)=>i?bodyShape.lineTo(z,y):bodyShape.moveTo(z,y));bodyShape.closePath();
 const bodyGeo=new T.ExtrudeGeometry(bodyShape,{depth:2.12,bevelEnabled:true,bevelThickness:.075,bevelSize:.065,bevelSegments:2,steps:1});
 const body=new T.Mesh(bodyGeo,paint);body.rotation.y=Math.PI/2;body.position.x=1.06;body.castShadow=true;body.receiveShadow=true;body.userData.zone='Carrocería';car.add(body);surfaces.push(body);
 // Carrocería inferior, capó y parachoques con piezas redondeadas.
 box(2.13,.36,4.35,paint,0,.70,0,'Paneles inferiores');
 box(2.06,.10,1.27,paint,0,1.39,-1.58,'Capó');
 box(2.12,.25,.24,paint,0,.81,-2.25,'Parachoques delantero');
 box(2.12,.26,.24,paint,0,.82,2.25,'Parachoques trasero');
 // Habitáculo trapezoidal con parabrisas y luneta inclinados.
 const roofShape=new T.Shape();
 [[-1.12,1.43],[-.67,2.06],[1.20,2.06],[1.80,1.43]].forEach(([z,y],i)=>i?roofShape.lineTo(z,y):roofShape.moveTo(z,y));roofShape.closePath();
 const cabGeo=new T.ExtrudeGeometry(roofShape,{depth:1.82,bevelEnabled:true,bevelThickness:.035,bevelSize:.045,bevelSegments:2});
 const cabin=new T.Mesh(cabGeo,glass);cabin.rotation.y=Math.PI/2;cabin.position.x=.91;cabin.castShadow=true;car.add(cabin);
 box(1.91,.10,1.89,paint,0,2.09,.27,'Techo');
 for(const side of [-1,1]){
  // Marcos y paneles laterales: las zonas de chapa admiten marcas.
  box(.075,.22,2.45,paint,side*1.065,1.34,.25,side<0?'Lado izquierdo':'Lado derecho');
  box(.055,.50,.10,black,side*.98,1.76,-.45,'Pilar central',false);
  box(.075,.52,.12,paint,side*.97,1.76,1.19,'Pilar trasero');
  box(.10,.12,.42,black,side*1.11,1.57,-.86,'Espejo',false);
  box(.07,.06,1.45,black,side*.77,2.18,.29,'Riel de techo',false);
  box(.065,.055,1.0,chrome,side*1.14,1.15,-.31,'Manijas',false);
  box(.065,.055,.65,chrome,side*1.14,1.15,1.0,'Manijas',false);
  box(.10,.12,3.88,black,side*1.10,.59,0,'Estribo',false);
  for(const z of [-1.45,1.46]){
   const tire=new T.Mesh(new T.CylinderGeometry(.47,.47,.26,40),black);tire.rotation.z=Math.PI/2;tire.position.set(side*1.13,.48,z);tire.castShadow=true;car.add(tire);
   const rim=new T.Mesh(new T.CylinderGeometry(.29,.29,.275,12),chrome);rim.rotation.z=Math.PI/2;rim.position.set(side*1.13+side*.025,.48,z);car.add(rim);
   const hub=new T.Mesh(new T.CylinderGeometry(.11,.11,.28,24),black);hub.rotation.z=Math.PI/2;hub.position.set(side*1.13+side*.04,.48,z);car.add(hub);
  }
 }
 box(1.48,.29,.085,black,0,.95,-2.39,'Parrilla',false);
 for(let h of [.85,.96,1.07])box(1.42,.025,.105,chrome,0,h,-2.45,'Parrilla',false);
 box(1.53,.08,.13,black,0,.62,-2.40,'Toma de aire',false);
 box(1.65,.10,.12,black,0,.70,2.40,'Difusor trasero',false);
 for(const side of [-1,1]){
  box(.62,.105,.15,lamp,side*.76,1.20,-2.38,'Faro',false);
  box(.49,.14,.14,tail,side*.80,1.19,2.38,'Luz trasera',false);
  box(.32,.055,.16,chrome,side*.74,.68,-2.40,'Antiniebla',false);
 }
 // Detalles adicionales para dar una silueta SUV moderna y reconocible.
 const seam=new T.MeshStandardMaterial({color:0x82909d,roughness:.62});
 function stroke(a,b,r,mat){const v=new T.Vector3(...a),w=new T.Vector3(...b),d=w.clone().sub(v);const o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),8),mat);o.position.copy(v).add(w).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());car.add(o);}
 for(const side of [-1,1]){
   const x=side*1.12;
   // Divisiones de las puertas, marcos de las ventanas y manijas.
   stroke([x,1.38,-.32],[x,.84,-.32],.012,seam);
   stroke([x,1.38,1.09],[x,.84,1.09],.012,seam);
   stroke([side*1.01,1.46,-1.07],[side*1.01,2.06,-.65],.025,black);
   stroke([side*1.01,1.47,-.30],[side*1.01,2.06,-.30],.023,black);
   stroke([side*1.01,1.47,1.10],[side*1.01,2.06,1.10],.023,black);
   stroke([side*1.01,1.47,-1.08],[side*1.01,1.47,1.73],.023,black);
   box(.07,.055,.29,chrome,side*1.15,1.26,-.61,'Manija',false);
   box(.07,.055,.29,chrome,side*1.15,1.26,.71,'Manija',false);
   // Rayos de los rines de aleación.
   for(const z of [-1.45,1.46])for(let k=0;k<5;k++){
     const a=k*Math.PI*2/5,wx=side*1.285;
     stroke([wx,.48+Math.sin(a)*.12,z+Math.cos(a)*.12],[wx,.48+Math.sin(a)*.27,z+Math.cos(a)*.27],.031,black);
   }
 }
 // Parabrisas y luneta inclinados.
 function windshield(points){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(points.flat(),3));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();const m=new T.Mesh(g,new T.MeshPhysicalMaterial({color:0x172c40,metalness:.16,roughness:.12,side:T.DoubleSide}));car.add(m);}
 windshield([[-.88,1.44,-1.12],[.88,1.44,-1.12],[.82,2.055,-.67],[-.82,2.055,-.67]]);
 windshield([[.88,1.44,1.80],[-.88,1.44,1.80],[-.82,2.055,1.20],[.82,2.055,1.20]]);
 box(1.37,.08,.12,black,0,.72,-2.46,'Entrada de aire',false);
 box(.64,.11,.08,chrome,0,1.01,2.45,'Placa trasera',false);
// Marcas adheridas a la superficie en coordenadas locales.
const markerGroup=new T.Group();car.add(markerGroup);function drawMarks(){markerGroup.clear();for(const m of marks){let ball=new T.Mesh(new T.SphereGeometry(.075,12,10),new T.MeshBasicMaterial({color:0xed283f,depthTest:false}));ball.position.set(m.x,m.y,m.z);ball.renderOrder=20;markerGroup.add(ball);}}
let yaw=.62,pitch=.23,dist=11.8;function update(){camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),1.15+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,1.15,0);}function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}resize();update();new ResizeObserver(resize).observe(stage);
let pointers=new Map(),start=null,moved=false,pinch=0;const raycaster=new T.Raycaster(),mouse=new T.Vector2();
function point(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects(surfaces,false)[0];}
function addMark(e){let hit=point(e);if(!hit)return;let pos=car.worldToLocal(hit.point.clone());let normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);pos.addScaledVector(normal,.085);marks.push({x:+pos.x.toFixed(3),y:+pos.y.toFixed(3),z:+pos.z.toFixed(3),tipo:document.getElementById('kind').value,zona:hit.object.userData.zone||'Carrocería'});drawMarks();emit();}
stage.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){start=[e.clientX,e.clientY];moved=false;}stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()];let d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)dist=Math.max(9.5,Math.min(19,dist*pinch/d));pinch=d;update();return;}pinch=0;if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>7)moved=true;if(mode==='rotate'){yaw-=(e.clientX-old[0])*.008;pitch=Math.max(-.05,Math.min(1.3,pitch+(e.clientY-old[1])*.006));update();}});
stage.addEventListener('pointerup',e=>{if(mode==='mark'&&!moved&&pointers.size===1)addMark(e);pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=0;});stage.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(9.5,Math.min(19,dist+e.deltaY*.009));update();},{passive:false});
function setMode(m){mode=m;document.getElementById('rotate').classList.toggle('on',m==='rotate');document.getElementById('mark').classList.toggle('on',m==='mark');}document.getElementById('rotate').onclick=()=>setMode('rotate');document.getElementById('mark').onclick=()=>setMode('mark');document.getElementById('undo').onclick=()=>{marks.pop();drawMarks();emit();};document.getElementById('clear').onclick=()=>{if(marks.length&&confirm('¿Eliminar todas las marcas 3D?')){marks=[];drawMarks();emit();}};
drawMarks();emit();function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='No se pudo iniciar el visor 3D: '+err.message;}
})();</script></body></html>
